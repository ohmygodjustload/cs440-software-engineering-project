<!doctype html>
<!--
  index.html — the only HTML page the server sends for the whole application.

  Purpose: acts as the host page for the single-page application. Angular renders the entire UI
  into the <app-root> element below, so this file stays deliberately empty.
    
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BAAAM Scheduling System</title>
  <meta name="description" content="Schedule and track medical, beauty, and fitness appointments.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=2">
</head>
<body>
  <!-- Angular renders the whole interface into this element, starting from AppComponent. -->
  <app-root></app-root>
</body>
</html>
