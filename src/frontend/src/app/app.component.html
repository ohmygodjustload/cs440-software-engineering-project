<!--
  app.component.html — the AppComponent template (the page frame shared by every route).

  Purpose: draws the top bar and marks where pages appear. Everything outside <router-outlet />
  stays on screen while the routed page changes.

-->

@if (!usesFullPageLayout) {
  <header
    class="app-header"
    [class.app-header--provider]="isProviderWorkspace"
    [class.route-hidden]="!routeVisible"
  >
    <span class="app-brand">{{ title }}</span>

  <nav class="app-nav" aria-label="Main">
    <ul class="app-nav__list">
      @for (link of navLinks; track link.path) {
        <li>
          <a
            class="app-nav__link"
            [routerLink]="link.path"
            routerLinkActive="app-nav__link--active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            >{{ link.label }}</a
          >
        </li>
      }
    </ul>
  </nav>

  @if (signedInUser) {
    <div class="app-account" aria-label="Signed-in account">
      <span class="app-account__initials" aria-hidden="true">{{ accountInitials }}</span>
      <span class="app-account__name">{{ accountDisplayName }}</span>
      <button class="app-account__signout" type="button" (click)="signOut()">Sign out</button>
    </div>
  }
</header>
}

<main class="app-main" [class.app-main--full-page]="usesFullPageLayout">
  <!--
    Browsers with the View Transitions API cross-fade pages natively (withViewTransitions in
    app.config.ts). Elsewhere, .app-route and the header fade out before a navigation swaps the
    page, then fade back in together (see app.component.css and AppComponent.routeVisible).
  -->
  <div class="app-route" [class.route-hidden]="!routeVisible">
    <router-outlet />
  </div>
</main>
