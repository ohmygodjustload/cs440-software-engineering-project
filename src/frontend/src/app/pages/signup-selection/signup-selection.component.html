<main class="signup-page">
  <section class="signup-card" aria-labelledby="signup-selection-title">
    <p class="signup-card__brand">BAAAM Scheduling System</p>
    <h1 id="signup-selection-title" class="signup-card__title">Create an account</h1>
    <p class="signup-card__lede">Choose the account type you would like to create.</p>

    <fieldset class="signup-choices">
      <legend class="signup-choices__legend">Account type</legend>

      <button
        class="signup-choice"
        type="button"
        [class.signup-choice--selected]="selectedType === 'client'"
        [attr.aria-pressed]="selectedType === 'client'"
        (click)="select('client')"
      >
        <svg class="signup-choice__icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
          <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z" />
        </svg>
        <span class="signup-choice__label">Client</span>
        <span class="signup-choice__hint">Book and manage appointments.</span>
      </button>

      <button
        class="signup-choice"
        type="button"
        [class.signup-choice--selected]="selectedType === 'serviceProvider'"
        [attr.aria-pressed]="selectedType === 'serviceProvider'"
        (click)="select('serviceProvider')"
      >
        <svg class="signup-choice__icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
          <path d="M10 4a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-4V6a2 2 0 0 0-2-2h-6Zm0 2h4v2h-4V6Zm-6 4h16v2H4v-2Z" />
        </svg>
        <span class="signup-choice__label">Service provider</span>
        <span class="signup-choice__hint">Offer your services to clients.</span>
      </button>
    </fieldset>

    <button class="signup-submit" type="button" [disabled]="!selectedType" (click)="continue()">
      Continue
    </button>

    <p class="signup-form__login">
      Already have an account? <a class="signup-link" routerLink="/login">Sign in</a>
    </p>
  </section>
</main>
