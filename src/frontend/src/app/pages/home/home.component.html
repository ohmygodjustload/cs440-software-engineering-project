  home.component.html — the HomeComponent template (the screen shown at "/").

  Purpose: a one-line placeholder so the top bar, routing, build, and tests can all be verified
  before any real UI exists. Replace this markup with the dashboard when that ticket is picked up.

-->

<div class="home-container">

  <!-- Greeting -->
  <section class="greeting">
    <h1>Good morning, [name]</h1>
    <p>[date]</p>
  </section>

  <!-- Summary cards -->
  <section class="stats">

    <div class="stat-card today-card">
      <p class="stat-title">Today</p>

      <div class="stat-info">
        <span class="stat-number">1</span>
        <span class="stat-description">appointment today</span>
      </div>
    </div>

    <div class="stat-card week-card">
      <p class="stat-title">This week</p>

      <div class="stat-info">
        <span class="stat-number">3</span>
        <span class="stat-description">appointments this week</span>
      </div>
    </div>

    <div class="stat-card reminder-card">
      <p class="stat-title">Reminders</p>

      <div class="stat-info">
        <span class="stat-number">2</span>
        <span class="stat-description">reminders scheduled</span>
      </div>
    </div>

  </section>


  <!-- Next appointment -->
  <section class="next-appointment">
    <h2>Next appointment</h2>

    <div class="appointment-card">

      <div class="appointment-content">

        <div class="appointment-meta">
          <span>MEDICAL</span>
          <span class="dot">•</span>
          <span>Today, 10:30 AM</span>
        </div>

        <h3>Annual physical</h3>

        <div class="appointment-details">
          <span>MEDICAL</span>
          <span class="dot">•</span>
          <span>Wembleh Hall</span>
        </div>

      </div>

      <button class="details-button">
        View details
      </button>

    </div>

  </section>

</div>
