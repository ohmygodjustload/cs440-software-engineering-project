<main class="signup-page">
  <section class="signup-card" aria-labelledby="signup-title">
    <p class="signup-card__brand">BAAAM Scheduling</p>
    <h1 id="signup-title" class="signup-card__title">Create an account</h1>
    <p class="signup-card__lede">Manage your appointments in one place.</p>

    <form class="signup-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="signup-form__row">
        <div class="signup-field">
          <label class="signup-field__label" for="firstName">First name</label>
          <input
            class="signup-field__input"
            id="firstName"
            name="firstName"
            type="text"
            autocomplete="given-name"
            formControlName="firstName"
            required
          />
        </div>

        <div class="signup-field">
          <label class="signup-field__label" for="lastName">Last name</label>
          <input
            class="signup-field__input"
            id="lastName"
            name="lastName"
            type="text"
            autocomplete="family-name"
            formControlName="lastName"
            required
          />
        </div>
      </div>

      <div class="signup-field">
        <label class="signup-field__label" for="username">Username</label>
        <input
          class="signup-field__input"
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          placeholder="Choose a unique username"
          formControlName="username"
          required
        />
        <p class="signup-field__hint">Usernames will be checked for uniqueness when backend registration is connected.</p>
      </div>

      <div class="signup-form__row">
        <div class="signup-field">
          <label class="signup-field__label" for="email">Email</label>
          <input
            class="signup-field__input"
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            formControlName="email"
            required
          />
        </div>

        <div class="signup-field">
          <label class="signup-field__label" for="phone">Phone number</label>
          <input
            class="signup-field__input"
            id="phone"
            name="phone"
            type="tel"
            autocomplete="tel"
            formControlName="phone"
            required
          />
        </div>
      </div>

      <div class="signup-field">
        <label class="signup-field__label" for="password">Password</label>
        <div class="signup-password">
          <input
            class="signup-field__input signup-password__input"
            id="password"
            name="password"
            [type]="passwordVisible ? 'text' : 'password'"
            autocomplete="new-password"
            placeholder="At least 8 characters"
            formControlName="password"
            required
          />
          <button
            class="signup-password__toggle"
            type="button"
            [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="passwordVisible"
            (click)="togglePasswordVisibility()"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M12 5c5.2 0 8.5 4.1 9.7 6-.9 1.5-4.2 6-9.7 6s-8.8-4.5-9.7-6c1.2-1.9 4.5-6 9.7-6Zm0 2c-3.7 0-6.3 2.5-7.3 4 1 1.5 3.6 4 7.3 4s6.3-2.5 7.3-4c-1-1.5-3.6-4-7.3-4Zm0 1.5A2.5 2.5 0 1 1 12 13a2.5 2.5 0 0 1 0-5Z" />
            </svg>
          </button>
        </div>
      </div>

      <div class="signup-field">
        <label class="signup-field__label" for="confirmPassword">Confirm password</label>
        <div class="signup-password">
          <input
            class="signup-field__input signup-password__input"
            id="confirmPassword"
            name="confirmPassword"
            [type]="confirmPasswordVisible ? 'text' : 'password'"
            autocomplete="new-password"
            formControlName="confirmPassword"
            required
          />
          <button
            class="signup-password__toggle"
            type="button"
            [attr.aria-label]="confirmPasswordVisible ? 'Hide confirm password' : 'Show confirm password'"
            [attr.aria-pressed]="confirmPasswordVisible"
            (click)="toggleConfirmPasswordVisibility()"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M12 5c5.2 0 8.5 4.1 9.7 6-.9 1.5-4.2 6-9.7 6s-8.8-4.5-9.7-6c1.2-1.9 4.5-6 9.7-6Zm0 2c-3.7 0-6.3 2.5-7.3 4 1 1.5 3.6 4 7.3 4s6.3-2.5 7.3-4c-1-1.5-3.6-4-7.3-4Zm0 1.5A2.5 2.5 0 1 1 12 13a2.5 2.5 0 0 1 0-5Z" />
            </svg>
          </button>
        </div>
        @if (hasPasswordMismatch) {
          <p class="signup-field__error">Passwords must match.</p>
        }
      </div>

      <button class="signup-submit" type="submit">Create account</button>

      @if (submitMessage) {
        <p class="signup-form__message">{{ submitMessage }}</p>
      }

      <p class="signup-form__login">
        Already have an account? <a class="signup-link" routerLink="/login">Sign in</a>
      </p>
    </form>
  </section>
</main>
