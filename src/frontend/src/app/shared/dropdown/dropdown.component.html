<button
  class="dropdown-trigger"
  type="button"
  role="combobox"
  [id]="inputId"
  [disabled]="disabled"
  [class.invalid]="invalid"
  [class.placeholder]="value === null"
  [attr.aria-label]="ariaLabel || null"
  [attr.aria-expanded]="open"
  [attr.aria-controls]="listId"
  [attr.aria-activedescendant]="open && activeIndex >= 0 ? optionId(activeIndex) : null"
  [attr.aria-invalid]="invalid || null"
  (click)="toggle()"
  (keydown)="handleKeydown($event)"
>
  <span>{{ selectedLabel }}</span>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="m7 10 5 5 5-5"/>
  </svg>
</button>

@if (open) {
  <div class="dropdown-menu" [id]="listId" role="listbox">
    @for (option of options; track option.value; let index = $index) {
      <div
        class="dropdown-option"
        role="option"
        [id]="optionId(index)"
        [class.active]="index === activeIndex"
        [class.selected]="option.value === value"
        [class.disabled]="option.disabled"
        [attr.aria-selected]="option.value === value"
        [attr.aria-disabled]="option.disabled || null"
        (mouseenter)="activeIndex = option.disabled ? activeIndex : index"
        (click)="select(option)"
      >
        <span>{{ option.label }}</span>
        @if (option.value === value) {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m5 12 4 4L19 6"/>
          </svg>
        }
      </div>
    }
  </div>
}
